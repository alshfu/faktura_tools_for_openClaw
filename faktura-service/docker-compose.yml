version: "3.9"
services:
  faktura:
    build: .
    image: faktura-service:latest
    container_name: faktura
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - PORT=3030
      - FAKTURA_FONTS_HREF=/fonts/fonts.css
    # Larger /dev/shm helps Chromium avoid crashes under load.
    shm_size: "1gb"
