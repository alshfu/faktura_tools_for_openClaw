[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bolagsverket"
version = "1.0.0"
description = "Python-библиотека для Bolagsverket API (Värdefulla datamängder)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.scripts]
bolagsverket-cli = "bolagsverket.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bolagsverket*"]
